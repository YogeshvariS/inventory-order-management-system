services:

  db:
    image: postgres:15
    container_name: inventory_db
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: inventory_backend
    restart: always

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: inventory_frontend
    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: